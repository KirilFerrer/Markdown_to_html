name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check Python syntax
        run: python -m compileall -q src tests
      - name: Lint Python code
        run: |
          python -m pip install ruff
          ruff check src tests --select E4,E7,E9,F
      - name: Run conversion and CLI tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  gui-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install pinned desktop dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify legacy Flet UI imports
        run: python -c "import sys; sys.path.insert(0, 'src'); import ui; assert callable(ui.main)"
